name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    # The app targets macOS (eframe/AppKit + CEF); tests run where it ships.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Cache CEF
        uses: actions/cache@v4
        with:
          path: .cef
          key: cef-${{ runner.arch }}-${{ hashFiles('scripts/fetch-cef.sh') }}

      - name: Fetch CEF
        run: scripts/fetch-cef.sh

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --locked

      - name: Shell syntax
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
